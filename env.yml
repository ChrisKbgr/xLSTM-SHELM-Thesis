name: xlstm_helm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.1
  - cuda-toolkit  # This provides the missing nvcc compiler
  - pip
  - pip:
    - "numpy<2.0.0"
    - "protobuf<4.0.0"
    - "setuptools<70.0.0"
    - xlstm
    - mlstm-kernels
    - gymnasium==0.28.1
    - shimmy>=0.2.1
    - stable-baselines3>=2.0.0
    - git+https://github.com/openai/CLIP.git
    - transformers>=4.41.0
    - accelerate